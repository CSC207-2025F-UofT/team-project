<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Share location with AccessGraph</title>
    <link rel="stylesheet" href="/location.css">
    <script src="/location.js" defer></script>
</head>
<body>
<main>
    <p class="brand">AccessGraph</p>
    <h1>Center the map on you</h1>
    <p>Share your location, then return to AccessGraph. Keep this page open while sharing.</p>
    <div class="actions">
        <button id="start" type="button">Start sharing location</button>
        <button id="stop" type="button" disabled>Stop sharing</button>
    </div>
    <p id="status" role="status" aria-live="polite">Choose Start sharing location, then allow location access.</p>
    <p id="accuracy"></p>
    <p>You can stop sharing here or in AccessGraph.</p>
</main>
</body>
</html>
